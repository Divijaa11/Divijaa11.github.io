<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divija Amaram | Full Stack Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <meta name="description"
        content="Portfolio of Divija Amaram, a Full Stack Developer specializing in React, Spring Boot, and AWS.">
</head>

<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">Divija Amaram</div>
            <div class="header-controls">
                <nav class="navbar"></nav>
                <button id="theme-toggle" class="theme-btn" aria-label="Toggle Dark/Light Mode">
                    <!-- Sun Icon -->
                    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <!-- Moon Icon -->
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <button class="menu-toggle" aria-label="Toggle navigation">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </header>

        <main class="main">
            <!-- Content populated by JS -->
            <div id="dynamic-content" class="content-wrapper">
                <!-- Using specific containers for clearer structure if needed, or letting JS append to main -->
                <section id="about" class="section about-section"></section>
                <section id="skills" class="section skills-section"></section>
                <section id="experience" class="section experience-section"></section>
                <section id="projects" class="section projects-section"></section>
                <section id="education" class="section education-section"></section>
                <section id="certifications" class="section certifications-section"></section>
                <section id="contacts" class="section contact-section">
                    <h3>Get In Touch</h3>
                    <div class="contact-layout">
                        <div class="contact-info">
                            <p class="contact-text">
                                Whether you have a question, a project idea, or just want to say hi, feel free to reach
                                out!
                            </p>
                            <!-- JS appends social links here -->
                            <div id="social-links" class="social-links-grid"></div>
                        </div>

                        <form action="https://formspree.io/f/mdaaeaak" method="POST" class="contact-form">
                            <input type="hidden" name="_subject" value="New submission from Portfolio!" />
                            <div class="form-group">
                                <input type="text" name="name" placeholder="Your Name" required>
                            </div>
                            <div class="form-group">
                                <input type="email" name="email" placeholder="Your Email" required>
                            </div>
                            <div class="form-group">
                                <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
                            </div>
                            <button type="submit" class="submit-btn">Send Message</button>
                        </form>
                    </div>
                </section>
            </div>
        </main>

    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <span id="close-lightbox" class="close-lightbox">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>
    <script src="script.js"></script>
</body>

</html>
